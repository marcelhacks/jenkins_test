name: FileZilla native validation lab

on:
  push:
    branches:
      - filezilla-native-lab-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-shell-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build exact Shell API probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          #define UNICODE
          #define _UNICODE
          #include <windows.h>
          #include <shellapi.h>
          #include <stdio.h>
          #include <string>

          int wmain(int argc, wchar_t** argv) {
              if (argc != 4) {
                  fwprintf(stderr, L"usage: shell_probe <host> <name> <mode>\n");
                  return 2;
              }

              std::wstring path = L"\\\\";
              path += argv[1];
              path += L"\\share\\";
              path += argv[2];
              const std::wstring mode = argv[3];

              if (mode == L"attributes") {
                  SetLastError(ERROR_SUCCESS);
                  DWORD attrs = GetFileAttributesW(path.c_str());
                  wprintf(L"mode=attributes path=%ls attrs=0x%08lx error=%lu\n",
                          path.c_str(), attrs, GetLastError());
                  return 0;
              }

              SHFILEINFOW info{};
              UINT flags = SHGFI_ICON | SHGFI_SMALLICON;
              if (mode == L"exact") {
                  flags |= SHGFI_USEFILEATTRIBUTES;
              }
              else if (mode != L"control") {
                  fwprintf(stderr, L"unknown mode\n");
                  return 2;
              }

              SetLastError(ERROR_SUCCESS);
              DWORD_PTR iconResult = SHGetFileInfoW(
                  path.c_str(), FILE_ATTRIBUTE_NORMAL, &info, sizeof(info), flags);
              DWORD iconError = GetLastError();
              if (info.hIcon) {
                  DestroyIcon(info.hIcon);
              }

              ZeroMemory(&info, sizeof(info));
              SetLastError(ERROR_SUCCESS);
              UINT typeFlags = SHGFI_TYPENAME;
              if (mode == L"exact") {
                  typeFlags |= SHGFI_USEFILEATTRIBUTES;
              }
              DWORD_PTR typeResult = SHGetFileInfoW(
                  path.c_str(), FILE_ATTRIBUTE_NORMAL, &info, sizeof(info), typeFlags);
              DWORD typeError = GetLastError();

              wprintf(L"mode=%ls path=%ls icon_result=%llu icon_error=%lu type_result=%llu type_error=%lu type=%ls\n",
                      mode.c_str(), path.c_str(),
                      static_cast<unsigned long long>(iconResult), iconError,
                      static_cast<unsigned long long>(typeResult), typeError,
                      info.szTypeName);
              return 0;
          }
          '@ | Set-Content -Encoding utf8 shell_probe.cpp

          & cl.exe /nologo /EHsc /W4 shell_probe.cpp shell32.lib user32.lib /Fe:shell_probe.exe
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed: $LASTEXITCODE" }

      - name: Observe outbound SMB attempts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force results | Out-Null

          # TEST-NET addresses are non-routable documentation space. There is no
          # SMB responder and this test never reads or captures credentials.
          pktmon filter remove | Out-Null
          pktmon filter add -p 445 | Out-File -Encoding utf8 results/pktmon-filter.txt
          pktmon start --capture --pkt-size 0 --file-name results/pktmon.etl | Out-File -Encoding utf8 results/pktmon-start.txt

          function Invoke-ProbeCase {
              param(
                  [Parameter(Mandatory=$true)][string]$Case,
                  [Parameter(Mandatory=$true)][string]$HostAddress,
                  [Parameter(Mandatory=$true)][string]$Name,
                  [Parameter(Mandatory=$true)][string]$Mode
              )

              $log = Join-Path $PWD "results\\$Case.txt"
              $process = Start-Process -FilePath (Join-Path $PWD 'shell_probe.exe') `
                  -ArgumentList @($HostAddress, $Name, $Mode) `
                  -RedirectStandardOutput $log -RedirectStandardError "$log.stderr" -PassThru

              # Sample connection state while the API is trying to resolve the UNC path.
              $states = @()
              for ($i = 0; $i -lt 50 -and -not $process.HasExited; ++$i) {
                  $states += Get-NetTCPConnection -RemoteAddress $HostAddress -RemotePort 445 -ErrorAction SilentlyContinue |
                      Select-Object LocalAddress,LocalPort,RemoteAddress,RemotePort,State,OwningProcess
                  Start-Sleep -Milliseconds 100
              }
              if (-not $process.WaitForExit(15000)) {
                  $process.Kill()
                  Add-Content -Encoding utf8 $log 'PROBE_TIMEOUT'
              }
              $states | Sort-Object RemoteAddress,State -Unique | Format-List | Out-File -Encoding utf8 "results/$Case-connections.txt"
          }

          Invoke-ProbeCase -Case 'exact-txt' -HostAddress '192.0.2.10' -Name 'probe.txt' -Mode 'exact'
          Invoke-ProbeCase -Case 'exact-lnk' -HostAddress '192.0.2.11' -Name 'probe.lnk' -Mode 'exact'

          # Positive controls: these APIs must resolve the supplied UNC path.
          Invoke-ProbeCase -Case 'shell-control-lnk' -HostAddress '192.0.2.12' -Name 'probe.lnk' -Mode 'control'
          Invoke-ProbeCase -Case 'attributes-control' -HostAddress '192.0.2.13' -Name 'probe.txt' -Mode 'attributes'

          pktmon stop | Out-File -Encoding utf8 results/pktmon-stop.txt
          pktmon format results/pktmon.etl -o results/pktmon.txt | Out-File -Encoding utf8 results/pktmon-format.txt
          Get-Content results/pktmon.txt | Select-String -Pattern '192\.0\.2\.(10|11|12|13)|445' |
              Set-Content -Encoding utf8 results/pktmon-relevant.txt

          Get-ChildItem results | Format-Table -AutoSize
          Get-Content results/pktmon-relevant.txt

      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-shell-results
          path: |
            results/**
            shell_probe.cpp
            shell_probe.exe
          if-no-files-found: warn
          retention-days: 7
